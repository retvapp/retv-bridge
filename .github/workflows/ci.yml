name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # RustSec advisories for Cargo.lock. Warnings fail the job too; the Linux-only ones are ignored, each with its
  # reason, in .cargo/audit.toml.
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit --deny warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # rustup reads rust-toolchain.toml (version, rustfmt, clippy) on first use.
      - name: Install toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # The release helpers fake Apple's tools through PATH shims (bash + perl).
      - name: Release script tests
        if: runner.os != 'Windows'
        run: bash scripts/test-release-scripts.sh

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>ReTV Home</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="bg"></div>
  <div id="chip"><i id="chipDisc"></i><span id="chipName"></span><b id="chipPro"></b></div>
  <div id="when"><div id="clock"></div><div id="date"></div></div>
  <div id="hero"><div id="heroArt"><i id="heroIcon"></i><span id="heroLabel"></span><div id="heroMinis"></div></div><div id="heroName"></div></div>
  <div id="dock"><div id="dockRing" class="ring"></div></div>
  <div id="allLine" class="btn"><span></span><i class="chev"></i></div>
  <p id="hint"></p>
  <p id="status"></p>
  <div id="all" class="layer"><h2 id="allTitle"></h2><div id="allEdit" class="btn"></div><p id="allHint"></p><div id="gridBox"><div id="grid"><div id="gridRing" class="ring"></div></div></div></div>
  <div id="opt" class="layer"><h2 id="optTitle"></h2><div id="optCards"></div><div id="optPage"><div id="optIn"></div></div></div>
  <div id="fold" class="layer"><h2 id="foldTitle"></h2><p id="foldHint"></p><div id="foldBox"><div id="foldGrid"><div id="foldRing" class="ring"></div></div></div></div>
  <div id="menu" class="layer"><div id="menuBox"><h2 id="menuTitle"></h2><div id="menuList"><div id="menuBody"></div></div><p id="menuHint" class="msg"></p></div></div>
  <div id="panel" class="layer"><div id="sheet"><h2 id="panelTitle"></h2><div id="panelBody"></div></div></div>
  <script src="logic.js"></script>
  <script src="main.js"></script>
  <script defer src="$WEBAPIS/webapis/webapis.js"></script>
</body>
</html>

[package]
name = "retv-bridge-adb"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Test-only fake adb for tests/tools.rs (cross-platform). It is built only
# with the `testbin` feature, which only this crate's own tests turn on
# (the self dev-dependency below), so a normal or release build never
# produces it.
[[bin]]
name = "retv-fake-adb"
path = "testbin/fake_adb.rs"
required-features = ["testbin"]
test = false
bench = false
doc = false

[features]
testbin = []

[dependencies]
retv-bridge-core = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
# Enables `testbin` for this crate's tests only (resolver 2 keeps dev features
# out of normal builds).
retv-bridge-adb = { path = ".", features = ["testbin"] }

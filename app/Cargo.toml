[package]
name = "retv-bridge-app"
description = "ReTV Bridge tray app (Tauri shell)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "retv_bridge_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "retv-bridge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
retv-bridge-core = { workspace = true }
retv-bridge-adb = { workspace = true }
retv-bridge-mdns = { workspace = true }
retv-bridge-samsung = { workspace = true }
retv-bridge-account = { workspace = true }
iana-time-zone = { workspace = true }
os_info = { workspace = true }
tauri = { workspace = true, features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-deep-link = { workspace = true }
tauri-plugin-autostart = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-updater = { workspace = true }
sys-locale = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# Cmd+Tab to Bridge with no window open: reopen it on «app became active» (AppKit sends no Reopen for Cmd+Tab).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSNotification", "NSString", "NSOperation", "block2"] }
block2 = "0.6.2"

[package]
name = "retv-bridge-account"
description = "ReTV Bridge: sign-in to the person's ReTV account (device code in the system browser), tokens in the OS key store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
zeroize = { workspace = true }
bytes = { workspace = true }

# The OS key stores, through crates already in the tree (native-tls and tauri use them).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security_Credentials"] }

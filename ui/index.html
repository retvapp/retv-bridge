<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ReTV Bridge</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="hdr">
      <!-- The ReTV Focus symbol. -->
      <svg class="logo" width="22" height="22" viewBox="0 0 32 32" aria-hidden="true">
        <rect class="a" x="1" y="9" width="14" height="14" rx="3.5" />
        <rect class="b" x="17.75" y="12.75" width="6.5" height="6.5" rx="1.75" />
        <rect class="b" x="25.5" y="12.75" width="6.5" height="6.5" rx="1.75" />
      </svg>
      <span class="name">ReTV Bridge</span>
      <span class="pill" id="pill" role="status"></span>
      <!-- «Войти в ReTV», or the signed-in account and its menu. -->
      <div class="acct" id="acct"></div>
      <div class="menu" id="acct-menu" role="menu" hidden></div>
    </header>

    <div class="tabs" id="tabs" role="tablist">
      <button type="button" role="tab" id="tab-code" data-tab="code" aria-controls="view-code"></button>
      <button type="button" role="tab" id="tab-samsung" data-tab="samsung" aria-controls="view-samsung"></button>
      <button type="button" role="tab" id="tab-log" data-tab="log" aria-controls="view-log"></button>
    </div>

    <section class="view" id="view-first" hidden>
      <div class="body" id="first-body"></div>
      <div class="foot" id="first-foot"></div>
    </section>

    <section class="view" id="view-code" role="tabpanel" aria-labelledby="tab-code" hidden>
      <div class="body" id="code-body"></div>
      <div class="foot" id="code-foot"></div>
    </section>

    <section class="view" id="view-samsung" role="tabpanel" aria-labelledby="tab-samsung" hidden>
      <nav class="steps" id="sam-steps"></nav>
      <div class="body" id="sam-body"></div>
      <div class="foot" id="sam-foot"></div>
    </section>

    <section class="view" id="view-log" role="tabpanel" aria-labelledby="tab-log" hidden>
      <div class="body">
        <!-- «Язык»: the window and the tray menu; kept in the settings. -->
        <div class="langrow">
          <label for="lang-pick" id="lang-label"></label>
          <select id="lang-pick"></select>
        </div>
        <p class="muted" id="log-lead"></p>
        <pre class="log" id="log" tabindex="0"></pre>
      </div>
      <div class="foot">
        <span class="hint" id="log-hint"></span>
        <button type="button" class="btn sec" id="log-copy"></button>
      </div>
    </section>

    <!-- The sign-in sheet: over the tabs while «Войти в ReTV» runs. -->
    <div class="scrim" id="scrim" hidden></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
      <div class="sheet-hd">
        <h2 id="sheet-title"></h2>
        <button type="button" class="x" id="sheet-x"></button>
      </div>
      <div class="body" id="sheet-body"></div>
      <div class="foot" id="sheet-foot"></div>
    </section>

    <div class="sr-only" id="live" aria-live="polite"></div>
  </body>
</html>
